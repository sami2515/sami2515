name: Refresh website screenshots for profile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m pip install pillow
      - name: Capture actual public websites
        run: node scripts/capture_screens.mjs
      - name: Build image cards using the screenshots
        run: python scripts/compose_cards.py --screenshots site-screenshots --out assets
      - name: Commit refreshed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/testtayar.png assets/assurex.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh project preview screenshots"
            git push
          fi
