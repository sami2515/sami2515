name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            "dist/github-snake.svg?color_snake=#0f766e&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39"
            "dist/github-snake-dark.svg?color_snake=#5eead4&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353"

      - name: Publish to gh-pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
